services:
  vigi-control:
    build: .
    container_name: vigi-control
    # host networking: cameras live on 192.168.101.x, reached through the
    # host's existing WireGuard tunnel — sharing the host's network
    # namespace/routing table avoids Docker's NAT/bridge getting in the way
    # of VPN-routed traffic. Linux-only, fine for this Ubuntu target.
    network_mode: host
    env_file: .env
    # Also set here (not only in the untracked .env) so a fresh deploy can't
    # come up in UTC — home mode's night window uses local getHours().
    environment:
      TZ: Asia/Bangkok
    volumes:
      - .:/app
    restart: unless-stopped
